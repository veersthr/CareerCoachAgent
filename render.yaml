services:
  - type: web
    name: career-coach-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free # skill canonicalization is now stdlib-only (no sentence-transformers/chromadb), so this fits free tier's 512MB
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: ALLOWED_ORIGINS
        sync: false # set to your Vercel frontend URL, e.g. https://my-app.vercel.app
